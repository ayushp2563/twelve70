<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>twelve70 — Outfit Color Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: rgba(255,255,255,0.08);
      --text: #e8e8ec;
      --muted: #6b6b7a;
      --accent: #7c6aff;
      --accent2: #ff6ab0;
      --green: #22c55e;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .nav-tab {
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
      transition: all 0.2s;
    }
    .nav-tab.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124,106,255,0.1);
    }
    .nav-tab:hover:not(.active) {
      border-color: rgba(255,255,255,0.15);
      color: var(--text);
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* ── Steps ── */
    .steps {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .step-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
      transition: all 0.2s;
    }
    .step-pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124,106,255,0.1);
    }
    .step-pill.done {
      border-color: var(--green);
      color: var(--green);
      background: rgba(34,197,94,0.1);
    }
    .step-pill .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Section title ── */
    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Color Grid ── */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      min-height: 80px;
    }

    .color-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: var(--surface2);
      transition: all 0.18s ease;
      position: relative;
    }
    .color-chip:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
    .color-chip.selected {
      border-color: var(--accent);
      background: rgba(124,106,255,0.12);
    }
    .color-chip.selected::after {
      content: '✓';
      position: absolute;
      top: 4px; right: 6px;
      font-size: 0.65rem;
      color: var(--accent);
      font-weight: 700;
    }

    .chip-swatch {
      width: 40px; height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      flex-shrink: 0;
    }
    .chip-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      word-break: break-word;
      line-height: 1.2;
    }
    .chip-score {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* ── Loading skeleton ── */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
    }
    .skeleton {
      height: 90px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--surface2) 25%, rgba(255,255,255,0.04) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    /* ── Predict button ── */
    .predict-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
    }
    .predict-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .predict-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Right panel — Summary ── */
    .summary-panel .card { margin-bottom: 16px; }

    .outfit-preview {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .outfit-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .outfit-row.empty { opacity: 0.35; }
    .outfit-row.predicted { border-color: var(--accent); background: rgba(124,106,255,0.08); }

    .outfit-swatch {
      width: 32px; height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .outfit-info { flex: 1; min-width: 0; }
    .outfit-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .outfit-value { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Prediction result ── */
    .result-card {
      background: linear-gradient(135deg, rgba(124,106,255,0.12), rgba(255,106,176,0.08));
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: var(--radius);
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    .result-primary {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .result-swatch {
      width: 56px; height: 56px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
    .result-name { font-size: 1.2rem; font-weight: 700; }
    .result-score {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--green);
      background: rgba(34,197,94,0.1);
      padding: 3px 10px;
      border-radius: 99px;
      margin-top: 4px;
    }
    .result-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(124,106,255,0.2);
      color: var(--accent);
      margin-left: 6px;
    }

    .reasons-list {
      list-style: none;
      margin-top: 10px;
    }
    .reasons-list li {
      font-size: 0.78rem;
      color: var(--muted);
      padding: 3px 0;
      padding-left: 14px;
      position: relative;
    }
    .reasons-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .alts-title { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin: 14px 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
    .alts-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .alt-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface2);
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .alt-chip:hover { border-color: var(--accent); }
    .alt-swatch { width: 14px; height: 14px; border-radius: 3px; }

    /* ── Reset ── */
    .reset-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.83rem;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 10px;
    }
    .reset-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    /* ── Match badge colours ── */
    .badge-exact   { background: rgba(34,197,94,0.15);  color: #22c55e; }
    .badge-partial { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .badge-scored  { background: rgba(124,106,255,0.2); color: #7c6aff; }
    .badge-fallback{ background: rgba(239,68,68,0.15);  color: #ef4444; }

    .empty-state {
      text-align: center;
      padding: 30px 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>✦ Outfit Color Builder</h1>
    <p>Pick each garment — we'll suggest the perfect layer combo in real time</p>
    
    <div class="nav-tabs">
      <a href="/outfit-builder.html" class="nav-tab active">Sequential Mode</a>
      <a href="/any-sequence-builder.html" class="nav-tab">Any-Sequence Mode</a>
    </div>
  </div>

<div class="layout">
  <!-- LEFT: step-by-step picker -->
  <div>
    <!-- Step pills -->
    <div class="steps" id="stepPills">
      <div class="step-pill active" data-step="0"><span class="dot"></span>Top</div>
      <div class="step-pill" data-step="1"><span class="dot"></span>Bottom</div>
      <div class="step-pill" data-step="2"><span class="dot"></span>Outerwear</div>
      <div class="step-pill" data-step="3"><span class="dot"></span>Footwear</div>
      <div class="step-pill" data-step="4"><span class="dot"></span>Predict</div>
    </div>

    <div class="card">
      <!-- Premium Context Filters -->
      <div class="filter-controls" style="display: flex; gap: 12px; margin-bottom: 20px; background: var(--surface2); padding: 14px; border-radius: var(--radius); border: 1px solid var(--border);">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em;">Occasion</label>
          <select id="filterOccasion" onchange="triggerFilterReload()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; outline: none; cursor: pointer; transition: border-color 0.2s;">
            <option value="any">Any Occasion</option>
            <option value="formal">👔 Formal</option>
            <option value="casual">☕ Casual</option>
            <option value="athletic">👟 Athletic</option>
          </select>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em;">Outfit Vibe</label>
          <select id="filterVibe" onchange="triggerFilterReload()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; outline: none; cursor: pointer; transition: border-color 0.2s;">
            <option value="any">Any Vibe</option>
            <option value="minimalist">🖤 Minimalist</option>
            <option value="maximalist">🌈 Maximalist</option>
          </select>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <label style="font-size: 0.65rem; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em;">Fit Profile</label>
          <select id="filterFit" onchange="triggerFilterReload()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; outline: none; cursor: pointer; transition: border-color 0.2s;">
            <option value="any">Any Fit</option>
            <option value="fitted">📐 Fitted / Blazer</option>
            <option value="oversized">🥋 Oversized / Cozy</option>
          </select>
        </div>
      </div>

      <div class="section-title" id="stepTitle">Choose your Top color</div>
      <div class="color-grid" id="colorGrid">
        <!-- skeleton on load -->
        <div class="skeleton-grid" id="skeleton" style="grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px">
          ${Array(12).fill('<div class="skeleton"></div>').join('')}
        </div>
      </div>

      <div class="divider"></div>
      <button class="predict-btn" id="predictBtn" disabled onclick="doPrediction()">
        🔮 Predict Top Outer Color
      </button>
    </div>
  </div>

  <!-- RIGHT: summary + result -->
  <div class="summary-panel">
    <div class="card">
      <div class="section-title">Your Outfit</div>
      <div class="outfit-preview">
        <div class="outfit-row empty" id="row-top">
          <div class="outfit-swatch" id="swatch-top" style="background:#333"></div>
          <div class="outfit-info">
            <div class="outfit-label">Top</div>
            <div class="outfit-value" id="val-top">—</div>
          </div>
        </div>
        <div class="outfit-row empty" id="row-bottom">
          <div class="outfit-swatch" id="swatch-bottom" style="background:#333"></div>
          <div class="outfit-info">
            <div class="outfit-label">Bottom</div>
            <div class="outfit-value" id="val-bottom">—</div>
          </div>
        </div>
        <div class="outfit-row empty" id="row-outerwear">
          <div class="outfit-swatch" id="swatch-outerwear" style="background:#333"></div>
          <div class="outfit-info">
            <div class="outfit-label">Outerwear</div>
            <div class="outfit-value" id="val-outerwear">—</div>
          </div>
        </div>
        <div class="outfit-row empty" id="row-footwear">
          <div class="outfit-swatch" id="swatch-footwear" style="background:#333"></div>
          <div class="outfit-info">
            <div class="outfit-label">Footwear</div>
            <div class="outfit-value" id="val-footwear">—</div>
          </div>
        </div>
        <div class="outfit-row empty predicted" id="row-outer" style="border-style:dashed">
          <div class="outfit-swatch" id="swatch-outer" style="background:#333"></div>
          <div class="outfit-info">
            <div class="outfit-label">Top Outer (predicted)</div>
            <div class="outfit-value" id="val-outer">—</div>
          </div>
        </div>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ Start over</button>
    </div>

    <!-- Prediction result -->
    <div id="resultArea"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
const state = { top: null, bottom: null, outerwear: null, footwear: null };
const STEPS = ['top','bottom','outerwear','footwear'];
const STEP_TITLES = [
  'Choose your Top color',
  'Choose your Bottom color',
  'Choose your Outerwear color',
  'Choose your Footwear color',
  'Ready to predict!',
];
let currentStep = 0;

// ─────────────────────────────────────────────────────────────────────────────
// API calls
// ─────────────────────────────────────────────────────────────────────────────
async function fetchOptions(step) {
  const params = new URLSearchParams();
  if (state.top)       params.set('topColor', state.top.color);
  if (state.bottom)    params.set('bottomColor', state.bottom.color);
  if (state.outerwear) params.set('outerwearColor', state.outerwear.color);

  // Parse active filters from UI dropdowns
  const occasion = document.getElementById('filterOccasion')?.value || 'any';
  const vibe = document.getElementById('filterVibe')?.value || 'any';
  const fitType = document.getElementById('filterFit')?.value || 'any';

  if (occasion !== 'any') params.set('occasion', occasion);
  if (vibe !== 'any') params.set('vibe', vibe);
  if (fitType !== 'any') params.set('fitType', fitType);

  const endpoints = {
    top:       '/api/outfit/step/tops?' + params,
    bottom:    '/api/outfit/step/bottom?' + params,
    outerwear: '/api/outfit/step/outerwear?' + params,
    footwear:  '/api/outfit/step/footwear?' + params,
  };

  try {
    const r = await fetch(endpoints[step]);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'API returned failure');
    return d.options || [];
  } catch (err) {
    console.error(`fetchOptions(${step}) failed:`, err);
    document.getElementById('colorGrid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">⚠️</div>
        Could not load colors — make sure the server is running on port 3000.<br>
        <small style="margin-top:6px;display:block">Error: ${err.message}</small>
      </div>`;
    return [];
  }
}

async function doPrediction() {
  if (!state.top || !state.bottom || !state.outerwear || !state.footwear) return;
  document.getElementById('resultArea').innerHTML = `
    <div class="card"><div class="skeleton-grid" style="display:grid;grid-template-columns:1fr;gap:10px">
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:40px"></div>
    </div></div>`;

  const occasion = document.getElementById('filterOccasion')?.value || 'any';
  const vibe = document.getElementById('filterVibe')?.value || 'any';
  const fitType = document.getElementById('filterFit')?.value || 'any';

  const r = await fetch('/api/outfit/predict-outer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      topColor:      state.top.color,
      bottomColor:   state.bottom.color,
      outerwearColor: state.outerwear.color,
      footwearColor: state.footwear.color,
      occasion: occasion !== 'any' ? occasion : undefined,
      vibe: vibe !== 'any' ? vibe : undefined,
      fitType: fitType !== 'any' ? fitType : undefined
    }),
  });
  const d = await r.json();
  if (!d.success) {
    document.getElementById('resultArea').innerHTML =
      `<div class="card"><p style="color:#ef4444">Error: ${d.error}</p></div>`;
    return;
  }

  const res = d.data;
  const p = res.primary;

  // Update summary row
  updateRow('outer', p.color, p.hex, false, p.patternUrl);

  const badgeClass = `badge-${res.matchType}`;
  const altsHtml = res.alternatives.length
    ? `<div class="alts-title">Alternatives</div>
       <div class="alts-row">${res.alternatives.map(a =>
         `<div class="alt-chip ${a.isFlagged ? 'flagged' : ''}" style="${a.isFlagged ? 'opacity:0.55;border:1px dashed #ef4444' : ''} ${a.patternUrl ? 'border: 1px solid var(--accent)' : ''}" onclick="applyAlt('${a.color}','${a.hex}','${a.patternUrl || ''}')">
            <div class="alt-swatch" style="${a.patternUrl ? `background-image:url('${a.patternUrl}');background-size:cover` : `background:${a.hex}`}"></div>
            <span>${a.color}</span>
            <span style="color:var(--muted);font-size:0.68rem">${a.isFlagged ? 'Flagged' : a.score}</span>
          </div>`).join('')}</div>` : '';

  const reasonsHtml = p.reasons.length
    ? `<ul class="reasons-list">${p.reasons.map(r => `<li>${r}</li>`).join('')}</ul>` : '';

  const actionButtonsHtml = `
    <div class="internal-action-section" style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <button class="btn" id="saveOutfitBtn" style="background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); font-size: 0.72rem; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;" onclick="saveCurrentOutfit('${state.top.color}', '${state.bottom.color}', '${state.outerwear.color}', '${state.footwear.color}', '${p.color}')">
        💾 Save Outfit (Feedback Loop)
      </button>
      <button class="btn btn-secondary" style="background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); font-size: 0.72rem; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px;" onclick="flagCurrentOutfit('${state.top.color}', '${state.bottom.color}', '${state.outerwear.color}', '${state.footwear.color}', '${p.color}')">
        🚨 Flag Combination as Bad
      </button>
    </div>
  `;

  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="result-primary">
        <div class="result-swatch" style="${p.patternUrl ? `background-image:url('${p.patternUrl}');background-size:cover` : `background:${p.hex}`}"></div>
        <div>
          <div class="result-name">${p.color}
            <span class="result-badge ${badgeClass}">${res.matchType}</span>
          </div>
          <div class="result-score">★ Score: ${p.score}/100</div>
        </div>
      </div>
      ${reasonsHtml}
      ${actionButtonsHtml}
      <div style="font-size:0.72rem;color:var(--muted);margin-top:8px">
        Searched ${res.totalCombosSearched.toLocaleString()} combinations
      </div>
      ${altsHtml}
    </div>`;
}

function applyAlt(color, hex, patternUrl) {
  updateRow('outer', color, hex, false, patternUrl);
}

// ─────────────────────────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────────────────────────
function showSkeleton() {
  document.getElementById('colorGrid').innerHTML =
    `<div style="display:contents">${Array(10).fill(
      '<div class="skeleton" style="height:90px;border-radius:10px"></div>'
    ).join('')}</div>`;
}

function renderChips(options) {
  const grid = document.getElementById('colorGrid');
  if (!options.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="icon">🎨</div>No options found — try a different combination</div>`;
    return;
  }

  const step = STEPS[currentStep];
  const selected = state[step]?.color;

  const normalOptions = options.filter(o => !o.isFlagged);
  const flaggedOptions = options.filter(o => o.isFlagged);

  let html = normalOptions.map(opt => `
    <div class="color-chip ${opt.color === selected ? 'selected' : ''}"
         onclick="selectColor('${opt.color}','${opt.hex}',${opt.score},${opt.frequency},'${opt.patternUrl || ''}')"
         title="${opt.reasons ? opt.reasons.join(' · ') : ''}"
         style="height: auto; padding-bottom: 12px;">
      <div class="chip-swatch" style="${opt.patternUrl ? `background-image:url('${opt.patternUrl}');background-size:cover` : `background:${opt.hex}`}"></div>
      <div class="chip-label" style="font-weight:600;">${opt.color}</div>
      ${opt.occasions && opt.occasions.length > 0 ? `<div style="font-size:0.55rem; color:var(--muted); text-transform:uppercase; margin-top:2px;">${opt.occasions.join(' · ')}</div>` : ''}
      <div class="chip-score" style="position:static; margin-top:6px; font-size:0.6rem; color:var(--accent); background:none; padding:0; font-weight:600; width:100%; text-align:center; white-space:normal; line-height:1.2;">
        ${opt.explanation || `${opt.score}pts`}
      </div>
    </div>`).join('');

  if (flaggedOptions.length > 0) {
    html += `
      <div class="flagged-banner-container" style="grid-column: 1 / -1; margin: 24px 0 12px 0;">
        <div class="flagged-banner" style="background: rgba(239, 68, 68, 0.12); border-left: 4px solid #ef4444; padding: 12px; border-radius: 6px; color: #f87171; font-size: 0.8rem; font-weight: 500;">
          ⚠️ Less Matched Combinations (Style Team Flagged: Will not look good on you)
        </div>
      </div>
      ${flaggedOptions.map(opt => `
        <div class="color-chip flagged ${opt.color === selected ? 'selected' : ''}"
             style="opacity: 0.65; border: 1px dashed rgba(239, 68, 68, 0.5); height: auto; padding-bottom: 12px;"
             onclick="selectColor('${opt.color}','${opt.hex}',${opt.score},${opt.frequency},'${opt.patternUrl || ''}')"
             title="${opt.reasons ? opt.reasons.join(' · ') : ''}">
          <div class="chip-swatch" style="${opt.patternUrl ? `background-image:url('${opt.patternUrl}');background-size:cover` : `background:${opt.hex}`}"></div>
          <div class="chip-label" style="font-weight:600;">${opt.color}</div>
          <div class="chip-score" style="background: #ef4444; color: white; position: static; margin-top: 6px; width: 100%; border-radius: 4px; padding: 2px 0; font-size: 0.6rem;">Flagged</div>
        </div>`).join('')}
    `;
  }

  grid.innerHTML = html;
}

function updateRow(slot, color, hex, empty, patternUrl) {
  const row = document.getElementById(`row-${slot}`);
  const swatch = document.getElementById(`swatch-${slot}`);
  if (patternUrl) {
    swatch.style.backgroundImage = `url('${patternUrl}')`;
    swatch.style.backgroundSize = 'cover';
  } else {
    swatch.style.backgroundImage = 'none';
    swatch.style.background = hex || '#333';
  }
  document.getElementById(`val-${slot}`).textContent = color || '—';
  row.classList.toggle('empty', empty || !color);
}

function updateStepPills() {
  document.querySelectorAll('.step-pill').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i < currentStep) el.classList.add('done');
    else if (i === currentStep) el.classList.add('active');
  });
  document.getElementById('stepTitle').textContent = STEP_TITLES[Math.min(currentStep, 4)];
}

// ─────────────────────────────────────────────────────────────────────────────
// Selection logic
// ─────────────────────────────────────────────────────────────────────────────
async function selectColor(color, hex, score, freq, patternUrl) {
  const step = STEPS[currentStep];
  state[step] = { color, hex, score, patternUrl };
  updateRow(step, color, hex, false, patternUrl);

  // Re-render current chips to show selection
  renderChips(await fetchOptions(step));   // lightweight re-fetch already cached by browser

  // Advance
  currentStep++;
  updateStepPills();

  if (currentStep < STEPS.length) {
    showSkeleton();
    const nextStep = STEPS[currentStep];
    const opts = await fetchOptions(nextStep);
    renderChips(opts);
  } else {
    // All 4 steps done — show predict button
    document.getElementById('colorGrid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">✅</div>All garments selected! Click Predict below.</div>`;
    document.getElementById('predictBtn').disabled = false;
  }
}

async function loadStep(step) {
  showSkeleton();
  const opts = await fetchOptions(STEPS[step]);
  renderChips(opts);
}

function resetAll() {
  Object.keys(state).forEach(k => state[k] = null);
  currentStep = 0;
  
  // Reset filter dropdowns
  const oSel = document.getElementById('filterOccasion');
  const vSel = document.getElementById('filterVibe');
  const fSel = document.getElementById('filterFit');
  if (oSel) oSel.value = 'any';
  if (vSel) vSel.value = 'any';
  if (fSel) fSel.value = 'any';

  document.getElementById('predictBtn').disabled = true;
  document.getElementById('resultArea').innerHTML = '';
  STEPS.forEach(s => updateRow(s, '', '#333', true));
  updateRow('outer', '', '#333', true);
  updateStepPills();
  loadStep(0);
}

async function triggerFilterReload() {
  if (currentStep < STEPS.length) {
    showSkeleton();
    const step = STEPS[currentStep];
    const opts = await fetchOptions(step);
    renderChips(opts);
  }
}

async function flagCurrentOutfit(topColor, bottomColor, outerwearColor, footwearColor, topOuterColor) {
  const reason = prompt("Enter internal reason for flagging this combination as bad (e.g. 'Red top under burgundy jacket clashes too heavily'):");
  if (reason === null) return;

  try {
    const res = await fetch('/api/outfit/flag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topColor,
        bottomColor,
        outerwearColor,
        footwearColor,
        topOuterColor,
        reason: reason || 'Flagged during internal testing'
      })
    });
    const d = await res.json();
    if (d.success) {
      alert(`Successfully flagged this combination! It will now be marked as flagged and shown under 'Less Matched' banner.`);
      doPrediction(); // fixed reference from predictOutfit()
    } else {
      alert(`Failed to flag: ${d.error}`);
    }
  } catch (err) {
    alert(`Error: ${err}`);
  }
}

async function saveCurrentOutfit(topColor, bottomColor, outerwearColor, footwearColor, topOuterColor) {
  try {
    const btn = document.getElementById('saveOutfitBtn');
    if (btn) {
      btn.disabled = true;
      btn.innerText = '💾 Saving...';
    }
    const res = await fetch('/api/outfit/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        topColor,
        bottomColor,
        outerwearColor,
        footwearColor,
        topOuterColor,
        interactionScore: 2
      })
    });
    const d = await res.json();
    if (d.success) {
      alert(`🎉 Outfit Saved Successfully!\nThis combination has been logged into the machine learning clicks database (data/training_clicks.csv).\nThe model will use this feedback in future training runs!`);
      if (btn) {
        btn.innerText = '💾 Saved! (Retraining Running)';
      }
    } else {
      alert(`Failed to save: ${d.error}`);
      if (btn) {
        btn.disabled = false;
        btn.innerText = '💾 Save Outfit (Feedback Loop)';
      }
    }
  } catch (err) {
    alert(`Error: ${err}`);
    const btn = document.getElementById('saveOutfitBtn');
    if (btn) {
      btn.disabled = false;
      btn.innerText = '💾 Save Outfit (Feedback Loop)';
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
loadStep(0);
</script>
